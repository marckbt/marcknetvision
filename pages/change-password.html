<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password — MarckNetVision</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/auth/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Change Password</h1>
    <p class="auth-sub" id="changeIntro">Use at least 12 characters. Other browsers will be logged out.</p>
    <form id="changeForm">
      <label for="current">Current password</label>
      <input id="current" type="password" autocomplete="current-password" required autofocus>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" required>
      <p class="auth-error" id="formError" role="alert" hidden></p>
      <button type="submit">Change Password</button>
    </form>
    <p class="auth-links"><a href="/" id="backLink">Back to dashboard</a> <button type="button" class="auth-link-btn" id="logoutBtn">Log Out</button></p>
  </main>
  <script src="/auth/common.js"></script>
  <script src="/auth/change-password.js"></script>
</body>
</html>
